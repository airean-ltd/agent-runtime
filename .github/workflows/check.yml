name: Check

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a PR replaces its running check. Pushes to main each run.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ready
      # The images are built, not pushed, so a broken Dockerfile fails here
      # rather than at a deploy. The smoke image copies the dist/ built above.
      - run: docker build gateway
      - run: docker build -f smoke/cloud-run/Dockerfile .
